
name: Build Design Your Space APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get app code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android --org com.designyourspace .

      - name: Configure Firebase Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          if not settings.exists() or not app.exists():
              raise SystemExit("Expected Gradle Kotlin files were not found")

          s = settings.read_text()
          s = s.replace(
              "plugins {",
              'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
              1
          )
          settings.write_text(s)

          a = app.read_text()
          a = a.replace(
              "plugins {",
              'plugins {\n    id("com.google.gms.google-services")',
              1
          )
          a = a.replace(
              'applicationId = "com.designyourspace.design_your_space"',
              'applicationId = "com.designyourspace.app"',
              1
          )
          app.write_text(a)
          PY
      - name: Show APK Signing SHA-1
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | grep SHA1
      - name: Build APK
        run: flutter build apk --debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: design-your-space-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
